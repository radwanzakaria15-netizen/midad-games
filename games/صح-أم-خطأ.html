<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صح أم خطأ</title><style>body{margin:0;background:#111b35;color:white;font-family:Tahoma;text-align:center;padding:20px}.box{max-width:520px;margin:30px auto;background:#ffffff12;padding:22px;border-radius:20px}button{padding:15px;margin:7px;border:0;border-radius:12px;background:#536dfe;color:white;font-size:18px}a{color:#9de8ff}</style><div class="box"><a href="../index.html">العودة لركن الألعاب</a><h2>صح أم خطأ</h2><p>النقاط: <b id="score">0</b></p><h2 id="statement">اضغط ابدأ</h2><button onclick="answer(true)">✔ صحيح</button><button onclick="answer(false)">✘ خطأ</button><p id="msg"></p><button onclick="next()">ابدأ / التالي</button></div><script>const qs=[['الأسبوع سبعة أيام',true],['الشمس كوكب',false],['الماء يتجمد بالبرودة',true],['القمر يضيء من نفسه',false],['النبات يحتاج الماء',true]];let i=-1,s=0,answered=false;function next(){i++;answered=false;if(i>=qs.length){document.getElementById('statement').textContent='انتهى التحدي!';document.getElementById('msg').textContent='نتيجتك '+s+' من 50';return}document.getElementById('statement').textContent=qs[i][0];document.getElementById('msg').textContent=''}function answer(v){if(i<0||i>=qs.length||answered)return;answered=true;if(v===qs[i][1]){s+=10;document.getElementById('score').textContent=s;document.getElementById('msg').textContent='إجابة صحيحة +10'}else document.getElementById('msg').textContent='إجابة غير صحيحة'}</script></html>
