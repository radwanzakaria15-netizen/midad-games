<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سباق الحروف</title><style>body{margin:0;background:#111b35;color:white;font-family:Tahoma;text-align:center;padding:20px}.box{max-width:520px;margin:30px auto;background:#ffffff12;padding:22px;border-radius:20px}button{padding:15px;margin:7px;border:0;border-radius:12px;background:#536dfe;color:white;font-size:18px}h1{font-size:42px}a{color:#9de8ff}</style><div class="box"><a href="../index.html">العودة لركن الألعاب</a><h2>سباق الحروف</h2><p>النقاط: <b id="score">0</b> | الجولة: <b id="round">1</b>/5</p><h1 id="letter">ب</h1><p>اختر الكلمة التي تبدأ بهذا الحرف</p><div id="choices"></div><p id="msg"></p><button onclick="next()">ابدأ / التالي</button></div><script>const qs=[['ب',['باب','شمس','قمر'],0],['م',['موز','كتاب','ورد'],0],['س',['سمكة','باب','قلم'],0],['ق',['قلم','نجم','بيت'],0],['ش',['شمس','مفتاح','ماء'],0]];let i=-1,s=0;function next(){i++;if(i>=qs.length){document.getElementById('letter').textContent='انتهى السباق!';document.getElementById('choices').innerHTML='';document.getElementById('msg').textContent='نتيجتك '+s+' من 50';return}document.getElementById('round').textContent=i+1;document.getElementById('letter').textContent=qs[i][0];document.getElementById('msg').textContent='';let c=document.getElementById('choices');c.innerHTML='';qs[i][1].forEach((w,n)=>{let b=document.createElement('button');b.textContent=w;b.onclick=()=>{if(n===qs[i][2]){s+=10;document.getElementById('score').textContent=s;document.getElementById('msg').textContent='إجابة صحيحة +10'}else document.getElementById('msg').textContent='حاول في السؤال التالي';};c.appendChild(b)})}</script></html>
