<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>صح أم خطأ - مِداد</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#263b70,#10172d 70%);color:#fff;min-height:100vh;padding:18px}
.wrap{max-width:720px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
a,.btn{border:0;border-radius:13px;padding:11px 15px;background:#ffffff18;color:white;text-decoration:none;font-weight:bold;cursor:pointer}
h1{font-size:clamp(24px,5vw,36px);margin:12px 0 5px}.sub{color:#c7d2fe;margin:0 0 20px}
.panel{background:#ffffff12;border:1px solid #ffffff22;border-radius:22px;padding:20px;box-shadow:0 18px 50px #0004}
.big{font-size:clamp(30px,8vw,56px);font-weight:900;text-align:center;margin:22px 0}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff30;background:#101a35;color:white;font-size:17px;margin:8px 0}
button.primary{background:linear-gradient(135deg,#22c1c3,#5b6cff);color:white;border:0;border-radius:13px;padding:14px 18px;font-size:17px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}
.options button{padding:16px 8px;border-radius:14px;border:1px solid #ffffff30;background:#ffffff12;color:white;font-size:17px;cursor:pointer;min-height:58px}
.options button:active,.primary:active{transform:scale(.98)}.stats{display:flex;justify-content:space-around;gap:8px;margin:15px 0;color:#dbeafe}
.feedback{min-height:30px;text-align:center;font-weight:bold;margin:12px 0}.good{color:#86efac}.bad{color:#fca5a5}
.progress{height:9px;background:#ffffff20;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#34d399;width:0;transition:width .3s}
@media(max-width:420px){body{padding:12px}.panel{padding:15px}.options{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap">
<div class="top"><a href="../index.html">← ركن الألعاب</a><span>مِداد ✦</span></div>
<h1>صح أم خطأ</h1><p class="sub">تحدٍّ سريع في المعلومات العامة واللغة.</p><section class="panel">
<div class="stats"><span>النقاط: <b id="score">0</b></span><span>الجولة: <b id="round">1</b>/8</span><span>الوقت: <b id="time">20</b>ث</span></div>
<div class="progress"><span id="bar"></span></div>
<div class="big" id="statement" style="font-size:clamp(23px,6vw,38px)">هل أنت مستعد؟</div>
<div class="options"><button id="yes">✔ صحيح</button><button id="no">✘ خطأ</button></div>
<div class="feedback" id="msg"></div><button class="primary" id="start">ابدأ الجولة</button>
</section>
</main><script>
const q=[["الأسبوع يتكون من سبعة أيام",true],["الشمس كوكب",false],["الماء يتجمد عند البرودة الشديدة",true],["عدد حروف كلمة (مدرسة) خمسة",true],["القمر يضيء من نفسه",false],["10 أكبر من 7",true],["النبات يحتاج إلى الماء لينمو",true],["اللغة العربية تكتب من اليسار إلى اليمين",false]];
let i=0,s=0,t=20,timer=null,active=false;const $=x=>document.getElementById(x);
function start(){clearInterval(timer);i=0;s=0;t=20;active=true;$('score').textContent=0;$('start').style.display='none';$('time').textContent=t;show();timer=setInterval(()=>{t--;$('time').textContent=t;if(t<=0)finish()},1000)}
function show(){if(i>=q.length){finish();return}$('round').textContent=i+1;$('bar').style.width=(i/q.length*100)+'%';$('statement').textContent=q[i][0];$('msg').textContent=''}
function pick(v){if(!active)return;if(v===q[i][1]){s+=10;$('score').textContent=s;$('msg').textContent='صحيح! +10';$('msg').className='feedback good'}else{$('msg').textContent='ليست الإجابة الصحيحة';$('msg').className='feedback bad'}i++;setTimeout(show,450)}
function finish(){if(!active)return;active=false;clearInterval(timer);$('statement').textContent='انتهت الجولة';$('msg').textContent='نتيجتك: '+s+' نقطة';$('start').textContent='العب مجدداً';$('start').style.display='block'}
$('yes').onclick=()=>pick(true);$('no').onclick=()=>pick(false);$('start').onclick=start;
</script></body></html>
