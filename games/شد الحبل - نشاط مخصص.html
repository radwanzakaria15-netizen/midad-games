<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#69b8e8"><title>شدّ الحبل | مِداد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--sky:#70c4f2;--grass:#76c85b;--deep:#173b27;--blue:#168fd0;--red:#e94e43;--gold:#ffd83d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tajawal,Arial,sans-serif;color:#fff}body{min-height:100vh;background:linear-gradient(#66b9eb 0 25%,#9bda8b 25% 42%,#70bd50 42% 100%);overflow-x:hidden}
button{font:inherit;cursor:pointer}.app{width:min(100%,760px);min-height:100vh;margin:auto;position:relative;padding:12px 13px 20px;display:flex;flex-direction:column}
.sky{position:absolute;inset:0 0 auto;height:280px;pointer-events:none;overflow:hidden;z-index:0;background:linear-gradient(#64b8ec,#c5edff 76%,#9bd77e 77%,#83cb67)}.sun{position:absolute;top:42px;right:13%;width:48px;height:48px;border-radius:50%;background:#ffe45c;box-shadow:0 0 28px #ffe45c99}.cloud{position:absolute;top:48px;left:8%;width:78px;height:22px;background:#fff;border-radius:30px;opacity:.9}.cloud:before,.cloud:after{content:"";position:absolute;bottom:5px;background:#fff;border-radius:50%;width:31px;height:31px}.cloud:before{left:12px}.cloud:after{left:35px;width:25px;height:25px}.cloud.c2{left:auto;right:7%;top:110px;transform:scale(.8)}
.hills{position:absolute;bottom:0;width:100%;height:55px;background:linear-gradient(165deg,transparent 0 30%,#87ce70 31% 100%)}.stands{position:absolute;bottom:12px;left:25%;width:50%;height:45px;border-top:7px solid #df596b;background:repeating-linear-gradient(90deg,#fff 0 9px,#e9f2fa 9px 13px);opacity:.8}
header{z-index:1;display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{background:#ffffffdf;color:#244a60;border-radius:13px;padding:7px 12px;font-weight:900;box-shadow:0 3px 0 #ffffff66}.topscore{background:#1d3544ed;border:2px solid #d8f1ff;border-radius:16px;padding:8px 15px;min-width:190px;text-align:center;font-size:16px;font-weight:900;box-shadow:0 4px 0 #24465755}.topscore b{color:#ff7468}.screen{z-index:1;display:none;flex:1}.screen.active{display:flex;flex-direction:column}
.intro{align-items:center;text-align:center;padding:45px 0 18px}.intro h1{font-size:clamp(36px,9vw,62px);margin:0 0 5px;color:#fff;text-shadow:3px 4px 0 #172d32,-2px -2px 0 #172d32,2px -2px 0 #172d32,-2px 2px 0 #172d32,0 7px 0 #28764c;letter-spacing:1px}.intro .subtitle{font-size:18px;font-weight:800;color:#fff;text-shadow:0 2px 4px #244c37;margin:0 0 22px}
.bigplay{width:174px;height:174px;border-radius:38px;border:6px solid #fff;background:#13b7aa;color:white;box-shadow:0 7px 0 #168d82,0 10px 20px #143c3440;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:900;margin:8px auto 25px;transition:.15s}.bigplay:active{transform:translateY(5px);box-shadow:0 2px 0 #168d82}.triangle{font-size:66px;line-height:1}
.mode-title{color:#ffe348;font-size:clamp(22px,5vw,32px);font-weight:900;text-shadow:0 3px 0 #78551b;margin:0 0 8px}.modes{display:flex;gap:12px;width:min(100%,480px);margin:auto}.mode{flex:1;min-height:110px;border-radius:20px;border:3px solid #ffffff66;background:#234b37dc;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:17px;box-shadow:0 5px 0 #183b2c55}.mode .emoji{font-size:38px;line-height:1.2}.mode.selected{border:4px solid var(--gold);background:#125b50}.intro-note{font-size:clamp(17px,4.5vw,24px);font-weight:800;line-height:1.8;text-shadow:0 2px 4px #19351e;margin:28px 0 12px}
.arena{padding-top:12px}.battle-title{text-align:center;font-size:clamp(34px,8vw,60px);font-weight:900;color:#42ed84;-webkit-text-stroke:2px #173b2d;text-shadow:0 5px 0 #216b42;margin:3px 0 0}.scene{height:250px;position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(#8bd5f6 0 38%,#a6dc81 38% 52%,#7bc653 52% 100%);border:2px solid #ffffff66;box-shadow:inset 0 -14px 0 #5da642;margin:6px 0 12px}
.scene .farhill{position:absolute;bottom:80px;width:160px;height:70px;background:#87c96c;border-radius:100% 100% 0 0}.scene .farhill.left{left:-35px}.scene .farhill.right{right:-35px}
.rope{position:absolute;left:0;right:0;top:61%;height:9px;background:repeating-linear-gradient(90deg,#8b5529 0 18px,#b98245 18px 23px);border:2px solid #70451f;border-radius:9px;z-index:3;box-shadow:0 3px 0 #4d351f}
.pit{position:absolute;left:50%;top:58%;transform:translateX(-50%);width:150px;height:35px;border-radius:50%;background:radial-gradient(ellipse,#412c18 0 48%,#95602d 52% 62%,#d1aa66 67% 75%,transparent 78%);z-index:2}
.marker{position:absolute;top:48%;left:50%;height:72px;width:7px;border-radius:8px;background:#f5f5f5;border:2px solid #d4e4e8;z-index:4;transform:translateX(-50%);transition:left .55s cubic-bezier(.2,.8,.2,1)}.marker:before{content:"";position:absolute;top:-8px;left:-9px;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:17px solid #ffdb45}
.flag{position:absolute;top:44%;height:60px;width:5px;background:#f5f5f5;border:1px solid #819ba5;z-index:2}.flag:before{content:"";position:absolute;top:2px;left:3px;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:18px solid var(--red)}.flag.blue{right:34%;}.flag.red{left:34%}.flag.blue:before{border-left-color:#168fd0}
.team{position:absolute;top:44%;display:flex;gap:3px;z-index:5;transition:transform .55s cubic-bezier(.2,.8,.2,1)}.team.red{left:5%;transform:translateX(var(--red-shift,0px))}.team.blue{right:5%;transform:translateX(var(--blue-shift,0px))}.avatar{width:clamp(48px,10vw,70px);height:75px;position:relative;filter:drop-shadow(0 3px 1px #28522c66);animation:bob 1.1s ease-in-out infinite alternate}.avatar:nth-child(2){animation-delay:.2s}.avatar:nth-child(3){animation-delay:.4s}@keyframes bob{from{translate:0 0}to{translate:0 -4px}}.bodyball{position:absolute;left:7%;top:10px;width:84%;height:53px;border-radius:48% 48% 43% 43%;border:3px solid #7d302a;background:linear-gradient(145deg,#ff9b83,#dc463f 65%,#a52d2b);box-shadow:inset -5px -5px 0 #9f302c55}.blue .bodyball{background:linear-gradient(145deg,#8de1ff,#258fd0 65%,#12609b);border-color:#15527a}.face{position:absolute;top:22px;left:24%;display:flex;gap:8px}.eye{width:7px;height:10px;border-radius:50%;background:#172b34;border:1px solid white}.smile{position:absolute;top:43px;left:39%;width:15px;height:7px;border-bottom:3px solid #54221e;border-radius:50%}.blue .smile{border-color:#123e5b}.band{position:absolute;top:48px;left:0;width:100%;height:8px;background:#e9bf57;border:1px solid #a0782d;border-radius:5px}.arms{position:absolute;top:38px;left:-3px;width:106%;height:8px;border-radius:8px;background:#e9bd56;border:2px solid #966a28;transform:rotate(-4deg)}.legs{position:absolute;bottom:0;left:20%;width:60%;height:9px;border-left:5px solid #503d31;border-right:5px solid #503d31}
.question-panel{border-radius:25px;padding:11px;background:linear-gradient(#4aa6d9,#2878ad);border:3px solid #e6f8ff;box-shadow:0 7px 0 #326b3f,0 12px 18px #1b462e44;margin-bottom:12px}.team-label{text-align:center;font-size:clamp(20px,5vw,29px);font-weight:900;padding:0 4px 8px;text-shadow:0 2px 2px #24516c}.question{background:linear-gradient(#fff,#edf2fa);color:#1d2939;border-radius:18px;border:2px solid #d6e6f2;padding:14px 12px;text-align:center;font-size:clamp(18px,4.7vw,25px);font-weight:900;line-height:1.55;min-height:74px;display:grid;place-items:center}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.answer{min-height:60px;border:4px solid #fff;border-radius:16px;background:#fff;color:#25374a;font-weight:900;font-size:clamp(15px,3.8vw,20px);padding:9px 10px;box-shadow:0 4px 0 #194d6e;text-align:center;transition:.12s}.answer:nth-child(1){border-color:#e65d51;color:#b33b34}.answer:nth-child(2){border-color:#399c70;color:#267650}.answer:nth-child(3){border-color:#e68a35;color:#a95718}.answer:nth-child(4){border-color:#3d79b5;color:#245b91}.answer:active{transform:translateY(3px)}.answer:disabled{opacity:.62;cursor:default}.answer.correct{background:#d6f9dc!important;border-color:#1ba65a!important;color:#146a39!important}.answer.wrong{background:#ffe1df!important;border-color:#d84a43!important;color:#a32d29!important}
.feedback{min-height:34px;text-align:center;font-weight:900;font-size:18px;padding:5px}.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding:8px 4px}.toolbtn{background:#ffffff38;border:2px solid #ffffff8c;color:#fff;border-radius:13px;padding:7px 13px;font-size:22px;font-weight:900}.result{position:absolute;inset:0;background:#10251dcc;z-index:10;display:none;place-items:center;padding:20px}.result.show{display:grid}.result-card{background:linear-gradient(#fff,#eaf5ff);color:#183449;border:4px solid #fff;border-radius:25px;padding:25px;width:min(100%,390px);text-align:center;box-shadow:0 18px 45px #0006}.result-card h2{font-size:34px;margin:0 0 8px;color:#168b60}.result-card p{font-size:19px;font-weight:800}.result-card button{background:#13b7aa;color:#fff;border:0;border-radius:13px;padding:13px 28px;font-weight:900;font-size:18px}
@media(max-width:440px){.app{padding:9px 9px 14px}.intro{padding-top:30px}.bigplay{width:150px;height:150px}.scene{height:215px}.avatar{height:68px}.question-panel{padding:8px}.answer{min-height:58px;padding:7px 5px}.team{top:45%}.intro-note{margin-top:24px}}
</style>
</head>
<body><div class="sky"><i class="sun"></i><i class="cloud"></i><i class="cloud c2"></i><i class="stands"></i><i class="hills"></i></div>
<main class="app">
<header><div class="brand">📘 مِداد</div><div class="topscore" id="scoreline">الفريق الأحمر <b>0</b> / <b>0</b> الفريق الأزرق</div></header>
<section class="screen intro active" id="home">
<h1>شدّ الحبل</h1><p class="subtitle">تحدَّ أصدقاءك واسحب الحبل نحو الفوز!</p>
<button class="bigplay" id="startGame"><span class="triangle">▶</span><span>ابدأ</span></button>
<div class="mode-title">اختر طريقة اللعب</div>
<div class="modes"><button class="mode" data-mode="teams"><span class="emoji">🟥 🟦</span>فريقان</button><button class="mode selected" data-mode="computer"><span class="emoji">🤖</span>ضد الحاسوب</button></div>
<p class="intro-note">أجب صحيحًا لتشدّ الحبل نحوك — كل إجابة صحيحة تمنح فريقك قوة إضافية!</p>
</section>
<section class="screen arena" id="battle">
<div class="battle-title" id="battleTitle">شدّة قوية!</div>
<div class="scene" id="scene">
<div class="farhill left"></div><div class="farhill right"></div><div class="pit"></div><div class="rope"></div><div class="flag red"></div><div class="flag blue"></div><div class="marker" id="marker"></div>
<div class="team red" id="redTeam"><div class="avatar"><div class="bodyball"></div><div class="face"><i class="eye"></i><i class="eye"></i></div><div class="smile"></div><div class="band"></div><div class="arms"></div><div class="legs"></div></div><div class="avatar"><div class="bodyball"></div><div class="face"><i class="eye"></i><i class="eye"></i></div><div class="smile"></div><div class="band"></div><div class="arms"></div><div class="legs"></div></div><div class="avatar"><div class="bodyball"></div><div class="face"><i class="eye"></i><i class="eye"></i></div><div class="smile"></div><div class="band"></div><div class="arms"></div><div class="legs"></div></div></div>
<div class="team blue" id="blueTeam"><div class="avatar"><div class="bodyball"></div><div class="face"><i class="eye"></i><i class="eye"></i></div><div class="smile"></div><div class="band"></div><div class="arms"></div><div class="legs"></div></div><div class="avatar"><div class="bodyball"></div><div class="face"><i class="eye"></i><i class="eye"></i></div><div class="smile"></div><div class="band"></div><div class="arms"></div><div class="legs"></div></div><div class="avatar"><div class="bodyball"></div><div class="face"><i class="eye"></i><i class="eye"></i></div><div class="smile"></div><div class="band"></div><div class="arms"></div><div class="legs"></div></div></div>
</div>
<div class="question-panel"><div class="team-label" id="turnLabel">دور الفريق الأزرق 🔵</div><div class="question" id="question">استعد للسؤال الأول!</div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div></div>
</section>
<div class="tools"><button class="toolbtn" id="menuBtn" title="القائمة">☰</button><div><button class="toolbtn" id="soundBtn" title="الصوت">🔊</button> <button class="toolbtn" id="fullBtn" title="ملء الشاشة">⛶</button></div></div>
<div class="result" id="result"><div class="result-card"><h2 id="resultTitle">فاز الفريق!</h2><p id="resultText"></p><button id="againBtn">العب مرة أخرى</button></div></div>
</main>
<script>
const defaults=[
{q:"ما عاصمة الجزائر؟",a:"الجزائر",o:["وهران","الجزائر","قسنطينة","عنابة"]},
{q:"كم عدد أيام الأسبوع؟",a:"سبعة",o:["خمسة","ستة","سبعة","ثمانية"]},
{q:"أيّ الكواكب أقرب إلى الشمس؟",a:"عطارد",o:["الأرض","المريخ","عطارد","زحل"]},
{q:"ما ضد كلمة «سريع»؟",a:"بطيء",o:["قوي","بطيء","قريب","واسع"]},
{q:"أيّ عضو نستخدمه للشم؟",a:"الأنف",o:["العين","الأذن","الأنف","اليد"]},
{q:"ناتج 6 × 4 هو؟",a:"24",o:["18","20","24","28"]},
{q:"أيّ فصل يأتي بعد الشتاء؟",a:"الربيع",o:["الصيف","الخريف","الربيع","الشتاء"]},
{q:"ما جمع كلمة «كتاب»؟",a:"كتب",o:["كتابون","كتابات","كتب","كاتب"]}
];
function loadActivity(){try{const id=new URLSearchParams(location.search).get("activity");if(!id)return null;const all=JSON.parse(localStorage.getItem("midadActivities")||"[]");return all.find(x=>String(x.id)===id&&x.template==="games/شد الحبل - نشاط مخصص.html")||null}catch(e){return null}}
function parseQuestions(raw){return String(raw||"").split(/\n+/).map(line=>line.split("|").map(x=>x.trim())).filter(p=>p.length>=3&&p[0]&&p[1]).map(p=>{let opts=p[2].split(/[،,]/).map(x=>x.trim()).filter(Boolean);if(!opts.includes(p[1]))opts.unshift(p[1]);return {q:p[0],a:p[1],o:opts.slice(0,4)}}).filter(x=>x.o.length>=2)}
const activity=loadActivity();let questions=activity?parseQuestions(activity.questions):defaults;
if(activity){document.querySelector(".intro h1").textContent=activity.name;document.querySelector(".subtitle").textContent="نشاط مخصص من مِداد · أجب عن الأسئلة واسحب الحبل نحو الفوز."}
let mode="computer",turn="blue",red=0,blue=0,position=0,index=0,locked=false,sound=true,started=false;
const $=id=>document.getElementById(id);
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");mode=b.dataset.mode}));
function start(){if(!questions.length){alert("لا توجد أسئلة صالحة في هذا النشاط. ارجع إلى منشئ الأنشطة وتأكد من صيغة الأسئلة.");return}$("home").classList.remove("active");$("battle").classList.add("active");$("result").classList.remove("show");red=0;blue=0;position=0;index=0;turn=mode==="computer"?"blue":"red";started=true;updateScore();nextQuestion()}
function updateScore(){$("scoreline").innerHTML='الفريق الأحمر <b>'+red+'</b> / <b>'+blue+'</b> الفريق الأزرق';$("marker").style.left=(50+position*3.5)+"%";$("redTeam").style.setProperty("--red-shift",Math.max(-34,position*5)+"px");$("blueTeam").style.setProperty("--blue-shift",Math.min(34,position*5)+"px")}
function nextQuestion(){if(index>=questions.length){if(red===blue){questions=questions.slice().sort(()=>Math.random()-.5);index=0}else return finish(red>blue?"red":"blue");}const q=questions[index%questions.length];$("question").textContent=q.q;$("turnLabel").textContent=mode==="computer"?(turn==="blue"?"دورك الآن 🔵":"دور الحاسوب 🔴"):(turn==="blue"?"دور الفريق الأزرق 🔵":"دور الفريق الأحمر 🔴");$("answers").innerHTML="";$("feedback").textContent="";q.o.forEach((v,i)=>{const b=document.createElement("button");b.className="answer";b.textContent=["أ","ب","ج","د"][i]+" · "+v;b.addEventListener("click",()=>answer(v,b,q));$("answers").appendChild(b)});locked=false}
function answer(value,button,q){if(locked)return;locked=true;const correct=value===q.a;document.querySelectorAll(".answer").forEach(b=>{b.disabled=true;if(b.textContent.endsWith(q.a))b.classList.add("correct")});if(!correct)button.classList.add("wrong");const gained=correct?1:0;let winner=correct?turn:(turn==="red"?"blue":"red");if(winner==="red")red++;else blue++;position=winner==="red"?Math.max(-8,position-1):Math.min(8,position+1);updateScore();$("feedback").textContent=correct?"إجابة صحيحة! شدّوا الحبل! 💪":"ليست صحيحة! الفريق الآخر يسحب الحبل.";if(sound)beep(correct?660:230);index++;setTimeout(()=>{if(Math.abs(position)>=8||red>=5||blue>=5){finish(position<0?"red":"blue");return}if(mode==="computer"&&turn==="blue"){turn="red";setTimeout(computerTurn,850)}else{turn=mode==="computer"?"blue":(turn==="red"?"blue":"red");nextQuestion()}},950)}
function computerTurn(){if(!started)return;const q=questions[index%questions.length];const correct=Math.random()<.68;const val=correct?q.a:q.o.find(x=>x!==q.a)||q.a;const btn=[...document.querySelectorAll(".answer")].find(b=>b.textContent.endsWith(val));if(btn)answer(val,btn,q)}
function finish(winner){started=false;$("resultTitle").textContent=winner==="red"?"فاز الفريق الأحمر! 🟥":"فاز الفريق الأزرق! 🟦";$("resultText").textContent="النتيجة النهائية: الأحمر "+red+" — "+blue+" الأزرق";$("result").classList.add("show");if(sound)beep(880)}
function backHome(){$("result").classList.remove("show");$("battle").classList.remove("active");$("home").classList.add("active");started=false}
function beep(freq){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.06,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);o.start();o.stop(c.currentTime+.17);o.onended=()=>c.close()}catch(e){}}
$("startGame").addEventListener("click",start);$("againBtn").addEventListener("click",start);$("menuBtn").addEventListener("click",backHome);$("soundBtn").addEventListener("click",()=>{sound=!sound;$("soundBtn").textContent=sound?"🔊":"🔇"});$("fullBtn").addEventListener("click",()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()});
</script></body></html>
