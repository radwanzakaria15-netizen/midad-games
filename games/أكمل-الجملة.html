<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أكمل الجملة</title><style>body{margin:0;background:#111b35;color:white;font-family:Tahoma;text-align:center;padding:20px}.box{max-width:520px;margin:30px auto;background:#ffffff12;padding:22px;border-radius:20px}button{padding:15px;margin:7px;border:0;border-radius:12px;background:#536dfe;color:white;font-size:18px}a{color:#9de8ff}</style><div class="box"><a href="../index.html">العودة لركن الألعاب</a><h2>أكمل الجملة</h2><p>النقاط: <b id="score">0</b></p><h2 id="sentence">اضغط ابدأ</h2><div id="choices"></div><p id="msg"></p><button onclick="next()">ابدأ / التالي</button></div><script>const qs=[['تشرق الشمس في ____','الصباح',['الصباح','الليل','المساء']],['يعيش السمك في ____','الماء',['الهواء','الماء','التراب']],['نكتب بالقلم على ____','الورق',['الماء','الورق','الزجاج']],['عاصمة الجزائر هي ____','الجزائر',['وهران','الجزائر','سطيف']],['مجموع 5 + 3 يساوي ____','8',['6','8','9']]];let i=-1,s=0;function next(){i++;if(i>=qs.length){document.getElementById('sentence').textContent='انتهى التحدي!';document.getElementById('choices').innerHTML='';document.getElementById('msg').textContent='نتيجتك '+s+' من 50';return}document.getElementById('sentence').textContent=qs[i][0];document.getElementById('msg').textContent='';let c=document.getElementById('choices');c.innerHTML='';qs[i][2].forEach(w=>{let b=document.createElement('button');b.textContent=w;b.onclick=()=>{if(w===qs[i][1]){s+=10;document.getElementById('score').textContent=s;document.getElementById('msg').textContent='ممتاز +10'}else document.getElementById('msg').textContent='الإجابة الصحيحة: '+qs[i][1]};c.appendChild(b)})}</script></html>
