<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#287653">
<title>مِداد | ركن الألعاب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#182b26;--muted:#708078;--green:#287653;--paper:#f1f5f2;--line:#dfe9e2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Tajawal,system-ui,sans-serif}
header{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(4vw,16px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:23px}
.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#58a77b,#1e563d);color:#fff;display:grid;place-items:center;box-shadow:0 5px 12px #1d654433}
.brand small{font-size:12px;color:#829087;font-weight:500}
.tag{font-size:12px;font-weight:800;background:#eaf4ed;color:var(--green);padding:8px 12px;border-radius:30px}
main{max-width:900px;margin:30px auto;padding:0 16px 50px}
.hero{border-radius:25px;padding:30px;color:#fff;background:radial-gradient(circle at 85% 20%,#72b88b 0,transparent 25%),linear-gradient(120deg,#173e32,#347b59);box-shadow:0 15px 35px #214c351c}
h1{font-size:clamp(27px,4vw,39px);margin:0 0 8px;font-weight:900}
.hero p{margin:0;color:#d7eee0;line-height:1.9}
.empty{margin-top:22px;min-height:260px;border:1px dashed #b9cfc0;border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
.icon{width:70px;height:70px;border-radius:22px;background:#eaf4ed;color:#287653;display:grid;place-items:center;font-size:34px;margin-bottom:14px}
.empty h2{margin:0 0 8px;font-size:23px}
.empty p{max-width:480px;margin:0;color:var(--muted);line-height:1.9}
.footer{text-align:center;color:#8a9890;font-size:12px;padding:28px 10px}
</style>
</head>
<body>
<header><div class="brand"><div class="mark">م</div><span>مِداد <small>| ركن الألعاب</small></span></div><div class="tag">مساحة التحدّي والتعلّم</div></header>
<main>
<section class="hero">
<h1>ركن ألعاب مِداد</h1>
<p>تم إخلاء المنصة من الألعاب السابقة. ستُجهّز مساحة الألعاب من جديد بتجارب وتحديات جديدة.</p>
</section>
<section class="empty">
<div class="icon">✦</div>
<h2>لا توجد ألعاب حاليًا</h2>
<p>تمت إزالة الألعاب القديمة وروابطها من المنصة. ستظهر الألعاب الجديدة هنا عند إضافتها.</p>
</section>
<footer class="footer">مِداد · مساحة تجمع التعلّم بالمتعة</footer>
</main>
</body>
</html>
